# Echo Web API Template
# A specialized web API template optimized for the Echo framework
# Part of Phase 7A: Web Framework Expansion

name: "web-api-echo"
description: "Echo framework-specialized Web API template with optimized patterns and middleware"
type: "web-api"
architecture: "echo"
version: "1.0.0"
author: "Go-Starter Team"
license: "MIT"
framework: "echo"

# Variables specific to Echo framework
variables:
  - name: "ProjectName"
    description: "Name of the project"
    type: "string"
    required: true
    validation: "^[a-zA-Z0-9_-]+$"

  - name: "ModulePath"
    description: "Go module path"
    type: "string"
    required: true
    validation: "^[a-zA-Z0-9._/-]+$"

  - name: "Author"
    description: "Project author"
    type: "string"
    required: false
    default: ""

  - name: "Email"
    description: "Author email"
    type: "string"
    required: false
    default: ""

  - name: "License"
    description: "Project license"
    type: "string"
    required: false
    default: "MIT"
    choices:
      - "MIT"
      - "Apache-2.0"
      - "GPL-3.0"
      - "BSD-3-Clause"

  - name: "GoVersion"
    description: "Go version to use"
    type: "string"
    required: false
    default: "1.21"

  - name: "Logger"
    description: "Logging library"
    type: "string"
    required: false
    default: "slog"
    choices:
      - "slog"
      - "zap"
      - "logrus"
      - "zerolog"

  - name: "DatabaseDriver"
    description: "Database driver"
    type: "string"
    required: false
    default: ""
    choices:
      - ""
      - "postgres"
      - "mysql"
      - "sqlite"
      - "redis"

  - name: "DatabaseORM"
    description: "Database ORM/query builder"
    type: "string"
    required: false
    default: ""
    choices:
      - ""
      - "gorm"
      - "sqlx"
      - "sqlc"

  - name: "AuthType"
    description: "Authentication type"
    type: "string"
    required: false
    default: ""
    choices:
      - ""
      - "jwt"
      - "oauth2"
      - "session"

  - name: "EnableMetrics"
    description: "Enable Prometheus metrics"
    type: "boolean"
    required: false
    default: true

  - name: "EnableTracing"
    description: "Enable OpenTelemetry tracing"
    type: "boolean"
    required: false
    default: false

# Dependencies specific to Echo framework
dependencies:
  # Core Echo dependencies
  - module: "github.com/labstack/echo/v4"
    version: "v4.11.3"
    
  # Echo middleware
  - module: "github.com/labstack/echo-jwt/v4"
    version: "v4.2.0"
    condition: "{{eq .AuthType \"jwt\"}}"

  # Common dependencies
  - module: "github.com/spf13/viper"
    version: "v1.16.0"

  # Logger dependencies
  - module: "go.uber.org/zap"
    version: "v1.26.0"
    condition: "{{eq .Logger \"zap\"}}"
    
  - module: "github.com/sirupsen/logrus"
    version: "v1.9.3"
    condition: "{{eq .Logger \"logrus\"}}"
    
  - module: "github.com/rs/zerolog"
    version: "v1.31.0"
    condition: "{{eq .Logger \"zerolog\"}}"

  # Database dependencies
  - module: "github.com/lib/pq"
    version: "v1.10.9"
    condition: "{{eq .DatabaseDriver \"postgres\"}}"
    
  - module: "github.com/go-sql-driver/mysql"
    version: "v1.7.1"
    condition: "{{eq .DatabaseDriver \"mysql\"}}"
    
  - module: "github.com/mattn/go-sqlite3"
    version: "v1.14.17"
    condition: "{{eq .DatabaseDriver \"sqlite\"}}"

  # ORM dependencies
  - module: "gorm.io/gorm"
    version: "v1.25.4"
    condition: "{{and (ne .DatabaseDriver \"\") (eq .DatabaseORM \"gorm\")}}"
    
  - module: "gorm.io/driver/postgres"
    version: "v1.5.2"
    condition: "{{and (eq .DatabaseDriver \"postgres\") (eq .DatabaseORM \"gorm\")}}"
    
  - module: "gorm.io/driver/mysql"
    version: "v1.5.2"
    condition: "{{and (eq .DatabaseDriver \"mysql\") (eq .DatabaseORM \"gorm\")}}"
    
  - module: "gorm.io/driver/sqlite"
    version: "v1.5.4"
    condition: "{{and (eq .DatabaseDriver \"sqlite\") (eq .DatabaseORM \"gorm\")}}"

  - module: "github.com/jmoiron/sqlx"
    version: "v1.3.5"
    condition: "{{and (ne .DatabaseDriver \"\") (ne .DatabaseDriver \"redis\") (eq .DatabaseORM \"sqlx\")}}"

  # Authentication dependencies
  - module: "github.com/golang-jwt/jwt/v5"
    version: "v5.0.0"
    condition: "{{eq .AuthType \"jwt\"}}"
    
  - module: "golang.org/x/oauth2"
    version: "v0.13.0"
    condition: "{{eq .AuthType \"oauth2\"}}"
    
  - module: "github.com/gorilla/sessions"
    version: "v1.2.1"
    condition: "{{eq .AuthType \"session\"}}"

  # Metrics dependencies
  - module: "github.com/prometheus/client_golang"
    version: "v1.17.0"
    condition: "{{.EnableMetrics}}"

  # Tracing dependencies
  - module: "go.opentelemetry.io/otel"
    version: "v1.21.0"
    condition: "{{.EnableTracing}}"
    
  - module: "go.opentelemetry.io/otel/trace"
    version: "v1.21.0"
    condition: "{{.EnableTracing}}"

  # Testing dependencies
  - module: "github.com/stretchr/testify"
    version: "v1.8.4"

# File generation definitions
files:
  # Core application files
  - source: "cmd/server/main.go.tmpl"
    destination: "cmd/server/main.go"

  - source: "go.mod.tmpl"
    destination: "go.mod"

  - source: "Makefile.tmpl"
    destination: "Makefile"

  - source: "README.md.tmpl"
    destination: "README.md"

  # Configuration
  - source: "internal/config/config.go.tmpl"
    destination: "internal/config/config.go"

  # Echo-specific server setup
  - source: "internal/server/server.go.tmpl"
    destination: "internal/server/server.go"

  # Echo-optimized handlers
  - source: "internal/handlers/health.go.tmpl"
    destination: "internal/handlers/health.go"

  - source: "internal/handlers/users.go.tmpl"
    destination: "internal/handlers/users.go"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "internal/handlers/auth.go.tmpl"
    destination: "internal/handlers/auth.go"
    condition: "{{and (ne .AuthType \"\") (ne .AuthType \"none\")}}"

  # Echo-specific middleware
  - source: "internal/middleware/cors.go.tmpl"
    destination: "internal/middleware/cors.go"

  - source: "internal/middleware/logger.go.tmpl"
    destination: "internal/middleware/logger.go"

  - source: "internal/middleware/recovery.go.tmpl"
    destination: "internal/middleware/recovery.go"

  - source: "internal/middleware/security.go.tmpl"
    destination: "internal/middleware/security.go"

  - source: "internal/middleware/auth.go.tmpl"
    destination: "internal/middleware/auth.go"
    condition: "{{and (ne .AuthType \"\") (ne .AuthType \"none\")}}"

  - source: "internal/middleware/metrics.go.tmpl"
    destination: "internal/middleware/metrics.go"
    condition: "{{.EnableMetrics}}"

  - source: "internal/middleware/tracing.go.tmpl"
    destination: "internal/middleware/tracing.go"
    condition: "{{.EnableTracing}}"

  # Logger - Simplified approach
  - source: "internal/logger/logger.go.tmpl"
    destination: "internal/logger/logger.go"
    
  - source: "internal/logger/interface.go.tmpl"
    destination: "internal/logger/interface.go"

  # Database
  - source: "internal/database/connection.go.tmpl"
    destination: "internal/database/connection.go"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "internal/database/migrations.go.tmpl"
    destination: "internal/database/migrations.go"
    condition: "{{ne .DatabaseDriver \"\"}}"

  # Models
  - source: "internal/models/base.go.tmpl"
    destination: "internal/models/base.go"
    condition: "{{or (ne .DatabaseDriver \"\") (ne .AuthType \"\")}}"

  - source: "internal/models/user.go.tmpl"
    destination: "internal/models/user.go"
    condition: "{{or (ne .DatabaseDriver \"\") (ne .AuthType \"\")}}"

  # Services
  - source: "internal/services/user.go.tmpl"
    destination: "internal/services/user.go"
    condition: "{{or (ne .DatabaseDriver \"\") (ne .AuthType \"\")}}"

  - source: "internal/services/auth.go.tmpl"
    destination: "internal/services/auth.go"
    condition: "{{and (ne .AuthType \"\") (ne .AuthType \"none\")}}"

  # Repository
  - source: "internal/repository/interfaces.go.tmpl"
    destination: "internal/repository/interfaces.go"
    condition: "{{or (ne .DatabaseDriver \"\") (ne .AuthType \"\")}}"

  - source: "internal/repository/user.go.tmpl"
    destination: "internal/repository/user.go"
    condition: "{{or (ne .DatabaseDriver \"\") (ne .AuthType \"\")}}"

  # Docker
  - source: "Dockerfile.tmpl"
    destination: "Dockerfile"

  - source: "docker-compose.yml.tmpl"
    destination: "docker-compose.yml"
    condition: "{{ne .DatabaseDriver \"\"}}"

  # Configuration files
  - source: "configs/config.dev.yaml.tmpl"
    destination: "configs/config.dev.yaml"

  - source: "configs/config.prod.yaml.tmpl"
    destination: "configs/config.prod.yaml"

  - source: "configs/config.test.yaml.tmpl"
    destination: "configs/config.test.yaml"

  # Environment and Git
  - source: ".env.example.tmpl"
    destination: ".env.example"

  - source: ".gitignore.tmpl"
    destination: ".gitignore"

  # API Documentation
  - source: "api/openapi.yaml.tmpl"
    destination: "api/openapi.yaml"

  # Database migrations
  - source: "migrations/001_create_users.up.sql.tmpl"
    destination: "migrations/001_create_users.up.sql"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "migrations/001_create_users.down.sql.tmpl"
    destination: "migrations/001_create_users.down.sql"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "migrations/embed.go.tmpl"
    destination: "migrations/embed.go"
    condition: "{{ne .DatabaseDriver \"\"}}"

  # Tests
  - source: "tests/integration/api_test.go.tmpl"
    destination: "tests/integration/api_test.go"

  - source: "tests/unit/handlers_test.go.tmpl"
    destination: "tests/unit/handlers_test.go"

  - source: "tests/unit/middleware_test.go.tmpl"
    destination: "tests/unit/middleware_test.go"

  - source: "tests/unit/services_test.go.tmpl"
    destination: "tests/unit/services_test.go"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "tests/testdata/fixtures.json.tmpl"
    destination: "tests/testdata/fixtures.json"
    condition: "{{ne .DatabaseDriver \"\"}}"

  # Scripts
  - source: "scripts/migrate.sh.tmpl"
    destination: "scripts/migrate.sh"
    condition: "{{ne .DatabaseDriver \"\"}}"

  - source: "scripts/dev.sh.tmpl"
    destination: "scripts/dev.sh"

  # GitHub workflows
  - source: ".github/workflows/ci.yml.tmpl"
    destination: ".github/workflows/ci.yml"

  - source: ".github/workflows/deploy.yml.tmpl"
    destination: ".github/workflows/deploy.yml"