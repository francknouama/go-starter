name: "lambda-event-processing"
displayName: "AWS Lambda Event Processing"
description: "Production-grade Lambda for SQS, SNS, EventBridge event processing with comprehensive observability and resilience patterns"
type: "lambda"
architecture: "event-processing"
version: "2.0.0"
category: "serverless"
complexity: "advanced"
tags: ["aws", "lambda", "sqs", "sns", "eventbridge", "event-processing", "serverless", "observability", "resilience"]

# Metadata
metadata:
  author: "go-starter"
  license: "MIT"
  goVersion: "1.21"
  
# Enhanced Template Variables
variables:
  - name: "ProjectName"
    type: "string"
    description: "Name of the Lambda event processing project"
    required: true
    validation: "^[a-zA-Z0-9_-]+$"

  - name: "ModulePath"
    type: "string"
    description: "Go module path (e.g., github.com/user/project)"
    required: true
    validation: "^[a-zA-Z0-9._/-]+$"

  - name: "GoVersion"
    type: "string"
    description: "Go version for the project"
    default: "1.21"
    choices: ["1.21", "1.22", "1.23"]

  - name: "LoggerType"
    type: "select"
    description: "Logging library optimized for CloudWatch"
    options: ["slog", "zap", "logrus", "zerolog"]
    default: "slog"

  - name: "EventSources"
    type: "multi-select"
    description: "Event sources to support"
    options: ["sqs", "sns", "eventbridge", "dynamodb-streams", "kinesis"]
    default: ["sqs", "sns"]

  - name: "ProcessingPattern"
    type: "select"
    description: "Event processing pattern"
    options: ["batch", "individual", "fanout", "aggregation"]
    default: "batch"

  - name: "ResilienceFeatures"
    type: "multi-select"
    description: "Resilience features to include"
    options: ["dlq", "retry", "circuit-breaker", "timeout", "backoff"]
    default: ["dlq", "retry", "timeout"]

  - name: "ObservabilityLevel"
    type: "select"
    description: "Observability level"
    options: ["basic", "standard", "advanced", "enterprise"]
    default: "advanced"

  - name: "SecurityFeatures"
    type: "multi-select"
    description: "Security features to include"
    options: ["input-validation", "secrets-manager", "iam-least-privilege", "encryption"]
    default: ["input-validation", "secrets-manager"]

  - name: "TestingLevel"
    type: "select"
    description: "Testing infrastructure level"
    options: ["basic", "standard", "comprehensive"]
    default: "comprehensive"

  - name: "DeploymentTargets"
    type: "multi-select"
    description: "Deployment targets"
    options: ["sam", "cdk", "terraform", "serverless-framework"]
    default: ["sam", "terraform"]

# Core File Structure (focusing on implemented files)
files:
  # Core Application Files
  - source: "main.go.tmpl"
    destination: "main.go"
    description: "Lambda entry point with multi-trigger support"

  - source: "go.mod.tmpl"
    destination: "go.mod"
    description: "Go module with AWS SDK v2 and observability dependencies"

  # Event Processing Core
  - source: "internal/handler/event_router.go.tmpl"
    destination: "internal/handler/event_router.go"
    description: "Intelligent event routing based on source type"

  - source: "internal/handler/sqs_handler.go.tmpl"
    destination: "internal/handler/sqs_handler.go"
    description: "SQS message processing with batch support"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"sqs\")) (and (kindIs \"slice\" .EventSources) (has \"sqs\" .EventSources))}}"

  - source: "internal/handler/sns_handler.go.tmpl"
    destination: "internal/handler/sns_handler.go"
    description: "SNS message processing with fanout support"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"sns\")) (and (kindIs \"slice\" .EventSources) (has \"sns\" .EventSources))}}"

  - source: "internal/handler/eventbridge_handler.go.tmpl"
    destination: "internal/handler/eventbridge_handler.go"
    description: "EventBridge event processing with intelligent routing"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"eventbridge\")) (and (kindIs \"slice\" .EventSources) (has \"eventbridge\" .EventSources))}}"

  # Domain Models and Events
  - source: "internal/domain/event.go.tmpl"
    destination: "internal/domain/event.go"
    description: "Event domain models and interfaces"

  - source: "internal/domain/message.go.tmpl"
    destination: "internal/domain/message.go"
    description: "Message types and processing results"

  # Configuration
  - source: "internal/config/config.go.tmpl"
    destination: "internal/config/config.go"
    description: "Configuration management for Lambda"

  # Enhanced Observability Stack
  - source: "internal/observability/logger.go.tmpl"
    destination: "internal/observability/logger.go"
    description: "Structured logging with correlation IDs"

  - source: "internal/observability/metrics.go.tmpl"
    destination: "internal/observability/metrics.go"
    description: "CloudWatch metrics collection"

  - source: "internal/observability/tracing.go.tmpl"
    destination: "internal/observability/tracing.go"
    description: "AWS X-Ray tracing integration"

  # Performance Optimization
  - source: "internal/performance/cold_start.go.tmpl"
    destination: "internal/performance/cold_start.go"
    description: "Cold start optimization patterns"

  # Processing Engines
  - source: "internal/processor/batch_processor.go.tmpl"
    destination: "internal/processor/batch_processor.go"
    description: "Batch processing engine for high-throughput scenarios"
    condition: "{{eq .ProcessingPattern \"batch\"}}"

  # Security Features
  - source: "internal/security/secrets_manager.go.tmpl"
    destination: "internal/security/secrets_manager.go"
    description: "AWS Secrets Manager integration"
    condition: "{{or (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"secrets-manager\")) (and (kindIs \"slice\" .SecurityFeatures) (has \"secrets-manager\" .SecurityFeatures))}}"

  # Resilience Patterns
  - source: "internal/resilience/circuit_breaker.go.tmpl"
    destination: "internal/resilience/circuit_breaker.go"
    description: "Circuit breaker pattern for fault tolerance"
    condition: "{{or (and (kindIs \"string\" .ResilienceFeatures) (eq .ResilienceFeatures \"circuit-breaker\")) (and (kindIs \"slice\" .ResilienceFeatures) (has \"circuit-breaker\" .ResilienceFeatures))}}"

  - source: "internal/resilience/dlq_handler.go.tmpl"
    destination: "internal/resilience/dlq_handler.go"
    description: "Dead letter queue handler for failed messages"
    condition: "{{or (and (kindIs \"string\" .ResilienceFeatures) (eq .ResilienceFeatures \"dlq\")) (and (kindIs \"slice\" .ResilienceFeatures) (has \"dlq\" .ResilienceFeatures))}}"

  # Infrastructure as Code
  - source: "template.yaml.tmpl"
    destination: "template.yaml"
    description: "AWS SAM template for serverless deployment"

  # Build and Deployment
  - source: "Makefile.tmpl"
    destination: "Makefile"
    description: "Build automation and deployment scripts"

  - source: "deploy.sh.tmpl"
    destination: "deploy.sh"
    executable: true
    description: "Deployment automation script"

  # Environment Configuration
  - source: "samconfig.toml.tmpl"
    destination: "samconfig.toml"
    description: "SAM CLI configuration for different environments"

  - source: "env-example.tmpl"
    destination: ".env.example"
    description: "Environment variables template"

  - source: "gitignore.tmpl"
    destination: ".gitignore"
    description: "Git ignore rules for Go and AWS"

  # Documentation
  - source: "README.md.tmpl"
    destination: "README.md"
    description: "Comprehensive documentation with examples"

# Enhanced Dependencies with AWS SDK v2
dependencies:
  # Core Lambda runtime
  - module: "github.com/aws/aws-lambda-go"
    version: "v1.47.0"
  
  # AWS SDK v2 Core
  - module: "github.com/aws/aws-sdk-go-v2"
    version: "v1.24.0"
  - module: "github.com/aws/aws-sdk-go-v2/config"
    version: "v1.26.1"
  - module: "github.com/aws/aws-sdk-go-v2/service/sqs"
    version: "v1.29.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"sqs\")) (and (kindIs \"slice\" .EventSources) (has \"sqs\" .EventSources))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/sns"
    version: "v1.26.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"sns\")) (and (kindIs \"slice\" .EventSources) (has \"sns\" .EventSources))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/eventbridge"
    version: "v1.25.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"eventbridge\")) (and (kindIs \"slice\" .EventSources) (has \"eventbridge\" .EventSources))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/dynamodb"
    version: "v1.26.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"dynamodb-streams\")) (and (kindIs \"slice\" .EventSources) (has \"dynamodb-streams\" .EventSources))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/kinesis"
    version: "v1.24.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"kinesis\")) (and (kindIs \"slice\" .EventSources) (has \"kinesis\" .EventSources))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/secretsmanager"
    version: "v1.25.0"
    condition: "{{or (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"secrets-manager\")) (and (kindIs \"slice\" .SecurityFeatures) (has \"secrets-manager\" .SecurityFeatures))}}"
  - module: "github.com/aws/aws-sdk-go-v2/service/cloudwatch"
    version: "v1.32.0"

  # Observability
  - module: "github.com/aws/aws-xray-sdk-go"
    version: "v1.8.4"
  
  # Logging libraries (conditional)
  - module: "go.uber.org/zap"
    version: "v1.26.0"
    condition: "{{eq .LoggerType \"zap\"}}"
  - module: "github.com/sirupsen/logrus"
    version: "v1.9.3"
    condition: "{{eq .LoggerType \"logrus\"}}"
  - module: "github.com/rs/zerolog"
    version: "v1.32.0"
    condition: "{{eq .LoggerType \"zerolog\"}}"

  # Validation and utilities
  - module: "github.com/go-playground/validator/v10"
    version: "v10.16.0"
    condition: "{{or (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"input-validation\")) (and (kindIs \"slice\" .SecurityFeatures) (has \"input-validation\" .SecurityFeatures))}}"
  - module: "github.com/google/uuid"
    version: "v1.5.0"

  # Testing dependencies
  - module: "github.com/stretchr/testify"
    version: "v1.8.4"
  - module: "github.com/testcontainers/testcontainers-go"
    version: "v0.27.0"
    condition: "{{eq .TestingLevel \"comprehensive\"}}"
  - module: "github.com/aws/aws-sdk-go-v2/feature/dynamodb/attributevalue"
    version: "v1.12.0"
    condition: "{{or (and (kindIs \"string\" .EventSources) (eq .EventSources \"dynamodb-streams\")) (and (kindIs \"slice\" .EventSources) (has \"dynamodb-streams\" .EventSources))}}"

# Post-generation hooks
post_hooks:
  - name: "clean_dependencies"
    command: "go mod tidy"
    work_dir: "{{.OutputPath}}"
  
  - name: "generate_mocks"
    command: "go generate ./..."
    work_dir: "{{.OutputPath}}"
    condition: "{{eq .TestingLevel \"comprehensive\"}}"

# Feature definitions for conditional generation
features:
  - name: "comprehensive_observability"
    description: "Complete AWS observability stack with X-Ray, CloudWatch, and custom metrics"
    enabled_when: "{{ne .ObservabilityLevel \"basic\"}}"
    
  - name: "advanced_security"
    description: "Enterprise security features with secrets management and input validation"
    enabled_when: "{{or (and (kindIs \"slice\" .SecurityFeatures) (or (has \"secrets-manager\" .SecurityFeatures) (has \"input-validation\" .SecurityFeatures))) (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"secrets-manager\")) (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"input-validation\"))}}"
    
  - name: "resilience_patterns"
    description: "Production resilience patterns with circuit breakers, retries, and DLQ"
    enabled_when: "{{gt (len .ResilienceFeatures) 1}}"
    
  - name: "multi_event_sources"
    description: "Support for multiple AWS event sources with intelligent routing"
    enabled_when: "{{gt (len .EventSources) 1}}"
    
  - name: "comprehensive_testing"
    description: "Full testing infrastructure with AWS service mocking and testcontainers"
    enabled_when: "{{eq .TestingLevel \"comprehensive\"}}"
    
  - name: "infrastructure_as_code"
    description: "Multiple deployment options with SAM, CDK, and Terraform"
    enabled_when: "{{gt (len .DeploymentTargets) 0}}"

# Quality gates and validation
quality_gates:
  - name: "compilation"
    description: "Generated code must compile successfully"
    command: "go build ./..."
    
  - name: "linting"
    description: "Code must pass linting checks"
    command: "golangci-lint run"
    
  - name: "unit_tests"
    description: "Unit tests must pass"
    command: "go test ./internal/..."
    
  - name: "security_scan"
    description: "Security vulnerabilities scan"
    command: "gosec ./..."
    condition: "{{or (and (kindIs \"string\" .SecurityFeatures) (eq .SecurityFeatures \"input-validation\")) (and (kindIs \"slice\" .SecurityFeatures) (has \"input-validation\" .SecurityFeatures))}}"