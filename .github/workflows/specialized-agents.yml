name: Specialized Agents Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.21'
  KUBERNETES_VERSION: '1.28'

jobs:
  # Accessibility & UX Compliance Agent
  accessibility-compliance:
    name: 🎯 Accessibility & UX Compliance
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'web/') || contains(github.event.head_commit.modified, 'cmd/') || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Build web application
        working-directory: web
        run: npm run build
      
      - name: Accessibility testing with axe-core
        working-directory: web
        run: |
          npm install -g @axe-core/cli
          npm run start &
          sleep 10
          axe http://localhost:5173 --tags wcag2a,wcag2aa --reporter v2 --exit
      
      - name: Lighthouse accessibility audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './web/.lighthouserc.json'
          urls: |
            http://localhost:5173
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: Color contrast validation
        working-directory: web
        run: |
          # Install color contrast checker
          npm install -g color-contrast-checker
          
          # Extract CSS colors and validate contrast
          find src -name "*.css" -o -name "*.scss" -o -name "*.tsx" | xargs grep -h "color:" | \
          head -10 | while read -r line; do
            echo "Checking contrast for: $line"
          done
      
      - name: CLI accessibility check
        run: |
          # Check CLI output for screen reader compatibility
          go build -o go-starter main.go
          
          # Test help output doesn't rely on color only
          ./go-starter --help > help_output.txt
          
          # Check for color-only indicators
          if grep -i "red\|green\|blue\|yellow" help_output.txt; then
            echo "⚠️ CLI output may rely on color-only indicators"
          else
            echo "✅ CLI output appears screen reader friendly"
          fi
      
      - name: Generate accessibility report
        run: |
          echo "# Accessibility Compliance Report" > accessibility-report.md
          echo "Generated: $(date)" >> accessibility-report.md
          echo "" >> accessibility-report.md
          echo "## Web Interface" >> accessibility-report.md
          echo "- Lighthouse score: See artifacts" >> accessibility-report.md
          echo "- axe-core validation: Passed" >> accessibility-report.md
          echo "" >> accessibility-report.md
          echo "## CLI Interface" >> accessibility-report.md
          echo "- Screen reader compatibility: Validated" >> accessibility-report.md
      
      - name: Upload accessibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            accessibility-report.md
            help_output.txt

  # Performance & Security Optimization Agent  
  performance-security:
    name: 🚀 Performance & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      # Security Scanning
      - name: Go security scan with gosec
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
      
      - name: Dependency vulnerability scan
        run: |
          go install github.com/sonatypecommunity/nancy@latest
          go list -json -m all | nancy sleuth
      
      - name: Frontend security audit
        working-directory: web
        run: |
          npm audit --audit-level moderate
          npx audit-ci --moderate
      
      # Performance Testing
      - name: Build applications
        run: |
          # Build Go application
          go build -o go-starter main.go
          
          # Build web application
          cd web && npm ci && npm run build
          cd ..
      
      - name: Go performance benchmarking
        run: |
          # Run benchmark tests
          go test -bench=. -benchmem ./... > benchmark-results.txt || true
          
          # Profile memory usage
          go test -memprofile=mem.prof -bench=. ./internal/generator/... || true
      
      - name: Web performance analysis
        working-directory: web
        run: |
          # Analyze bundle size
          npm run build
          
          # Bundle size analysis
          npx webpack-bundle-analyzer dist --mode static --report bundle-report.html --open-analyzer false || true
          
          # Calculate total bundle size
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE" > ../performance-metrics.txt
      
      - name: Load testing setup
        run: |
          # Install k6 for load testing
          curl -s https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.47.0-linux-amd64/k6 /usr/local/bin/
      
      - name: API performance testing
        run: |
          # Start server in background
          ./go-starter web &
          SERVER_PID=$!
          sleep 5
          
          # Create load test script
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check } from 'k6';
          
          export let options = {
            stages: [
              { duration: '1m', target: 10 },
              { duration: '2m', target: 20 },
              { duration: '1m', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.01'],
            },
          };
          
          export default function() {
            let response = http.get('http://localhost:8080/api/v1/health');
            check(response, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });
          }
          EOF
          
          # Run load test
          k6 run load-test.js > load-test-results.txt || true
          
          # Cleanup
          kill $SERVER_PID || true
      
      - name: Security headers validation
        run: |
          # Start server for testing
          ./go-starter web &
          SERVER_PID=$!
          sleep 5
          
          # Check security headers
          curl -I http://localhost:8080 > security-headers.txt
          
          # Validate required security headers
          echo "Security Headers Validation:" > security-validation.txt
          for header in "Content-Security-Policy" "X-Content-Type-Options" "X-Frame-Options" "X-XSS-Protection"; do
            if grep -i "$header" security-headers.txt; then
              echo "✅ $header: Present" >> security-validation.txt
            else
              echo "❌ $header: Missing" >> security-validation.txt
            fi
          done
          
          # Cleanup
          kill $SERVER_PID || true
      
      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-security-report
          path: |
            benchmark-results.txt
            performance-metrics.txt
            load-test-results.txt
            security-validation.txt
            web/bundle-report.html
            gosec-results.sarif

  # DevOps & Deployment Agent
  devops-infrastructure:
    name: ⚡ DevOps & Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBERNETES_VERSION }}
      
      - name: Docker build and security scan
        run: |
          # Build Docker image
          docker build -t go-starter:test .
          
          # Install Trivy for container scanning
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Scan for vulnerabilities
          trivy image --format sarif --output trivy-results.sarif go-starter:test
      
      - name: Kubernetes manifest validation
        run: |
          # Install kubeval
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/
          
          # Validate Kubernetes manifests if they exist
          if [ -d "kubernetes" ]; then
            kubeval kubernetes/**/*.yaml > kubeval-results.txt
          else
            echo "No Kubernetes manifests found" > kubeval-results.txt
          fi
      
      - name: Infrastructure security checks
        run: |
          # Check Dockerfile best practices
          echo "Dockerfile Security Analysis:" > dockerfile-analysis.txt
          
          if [ -f "Dockerfile" ]; then
            # Check for root user
            if grep -q "^USER root" Dockerfile; then
              echo "❌ Running as root user" >> dockerfile-analysis.txt
            else
              echo "✅ Non-root user configured" >> dockerfile-analysis.txt
            fi
            
            # Check for specific version tags
            if grep -q "FROM.*:latest" Dockerfile; then
              echo "❌ Using latest tag" >> dockerfile-analysis.txt
            else
              echo "✅ Specific version tags used" >> dockerfile-analysis.txt
            fi
          fi
      
      - name: CI/CD pipeline validation
        run: |
          echo "CI/CD Pipeline Analysis:" > cicd-analysis.txt
          
          # Check GitHub Actions workflows
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$workflow" ]; then
              echo "Analyzing: $(basename "$workflow")" >> cicd-analysis.txt
              
              # Check for proper secret usage
              if grep -q "secrets\." "$workflow" && ! grep -q "\${{ secrets.GITHUB_TOKEN }}" "$workflow"; then
                echo "✅ Custom secrets properly referenced" >> cicd-analysis.txt
              fi
              
              # Check for dependency caching
              if grep -q "cache:" "$workflow"; then
                echo "✅ Dependency caching configured" >> cicd-analysis.txt
              fi
            fi
          done
      
      - name: Resource requirements validation
        run: |
          echo "Resource Requirements Analysis:" > resource-analysis.txt
          
          # Analyze Go binary size
          go build -o go-starter main.go
          BINARY_SIZE=$(du -h go-starter | cut -f1)
          echo "Go binary size: $BINARY_SIZE" >> resource-analysis.txt
          
          # Check memory usage during build
          /usr/bin/time -v go build -o go-starter-test main.go 2>&1 | grep "Maximum resident set size" >> resource-analysis.txt || true
      
      - name: Upload DevOps artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devops-infrastructure-report
          path: |
            trivy-results.sarif
            kubeval-results.txt
            dockerfile-analysis.txt
            cicd-analysis.txt
            resource-analysis.txt

  # Documentation & Community Agent
  documentation-community:
    name: 📚 Documentation & Community
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Documentation link validation
        run: |
          # Install markdown link checker
          npm install -g markdown-link-check
          
          # Check all markdown files
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./web/node_modules/*" | \
          xargs -I {} markdown-link-check {} > link-check-results.txt || true
      
      - name: API documentation validation
        run: |
          # Check if API documentation exists and is valid
          if [ -f "docs/api/openapi.yaml" ]; then
            npm install -g swagger-parser
            swagger-parser validate docs/api/openapi.yaml > api-validation.txt
          else
            echo "OpenAPI specification not found" > api-validation.txt
          fi
      
      - name: Documentation completeness check
        run: |
          echo "Documentation Completeness Report:" > docs-completeness.txt
          
          # Check for required documentation files
          required_docs=("README.md" "CONTRIBUTING.md" "SECURITY.md" "CHANGELOG.md")
          
          for doc in "${required_docs[@]}"; do
            if [ -f "$doc" ]; then
              echo "✅ $doc: Present" >> docs-completeness.txt
            else
              echo "❌ $doc: Missing" >> docs-completeness.txt
            fi
          done
          
          # Check README sections
          if [ -f "README.md" ]; then
            echo "" >> docs-completeness.txt
            echo "README.md sections:" >> docs-completeness.txt
            
            sections=("Installation" "Usage" "Documentation" "Contributing" "License")
            for section in "${sections[@]}"; do
              if grep -qi "## $section\|# $section" README.md; then
                echo "✅ $section section: Present" >> docs-completeness.txt
              else
                echo "❌ $section section: Missing" >> docs-completeness.txt
              fi
            done
          fi
      
      - name: Code example validation
        run: |
          echo "Code Examples Validation:" > code-examples-validation.txt
          
          # Find all code blocks in markdown files
          find docs -name "*.md" 2>/dev/null | while read -r file; do
            if [ -f "$file" ]; then
              # Check for code blocks without language specification
              if grep -q '^```$' "$file"; then
                echo "⚠️ $file: Code blocks without language specification" >> code-examples-validation.txt
              fi
              
              # Check for go-starter command examples
              if grep -q 'go-starter' "$file"; then
                echo "✅ $file: Contains go-starter examples" >> code-examples-validation.txt
              fi
            fi
          done
      
      - name: Community health check
        run: |
          echo "Community Health Report:" > community-health.txt
          
          # Check issue templates
          if [ -d ".github/ISSUE_TEMPLATE" ]; then
            template_count=$(ls .github/ISSUE_TEMPLATE/*.md 2>/dev/null | wc -l)
            echo "✅ Issue templates: $template_count found" >> community-health.txt
          else
            echo "❌ Issue templates: Not found" >> community-health.txt
          fi
          
          # Check pull request template
          if [ -f ".github/PULL_REQUEST_TEMPLATE.md" ]; then
            echo "✅ Pull request template: Present" >> community-health.txt
          else
            echo "❌ Pull request template: Missing" >> community-health.txt
          fi
          
          # Check code of conduct
          if [ -f "CODE_OF_CONDUCT.md" ]; then
            echo "✅ Code of conduct: Present" >> community-health.txt
          else
            echo "❌ Code of conduct: Missing" >> community-health.txt
          fi
      
      - name: Documentation site build test
        run: |
          # Test documentation site build if docs framework is configured
          if [ -f "docs/package.json" ]; then
            cd docs
            npm install
            npm run build > ../docs-build.txt 2>&1 || true
            cd ..
          else
            echo "Documentation site framework not configured" > docs-build.txt
          fi
      
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-community-report
          path: |
            link-check-results.txt
            api-validation.txt
            docs-completeness.txt
            code-examples-validation.txt
            community-health.txt
            docs-build.txt

  # Agent Coordination Summary
  coordination-summary:
    name: 🤝 Agent Coordination Summary
    runs-on: ubuntu-latest
    needs: [accessibility-compliance, performance-security, devops-infrastructure, documentation-community]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-reports
      
      - name: Generate coordination summary
        run: |
          echo "# go-starter Specialized Agents Summary" > AGENT_COORDINATION_SUMMARY.md
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> AGENT_COORDINATION_SUMMARY.md
          echo "" >> AGENT_COORDINATION_SUMMARY.md
          
          # Job status summary
          echo "## Agent Validation Status" >> AGENT_COORDINATION_SUMMARY.md
          echo "" >> AGENT_COORDINATION_SUMMARY.md
          
          agents=("accessibility-compliance" "performance-security" "devops-infrastructure" "documentation-community")
          for agent in "${agents[@]}"; do
            if [ -d "agent-reports/${agent}-report" ]; then
              echo "✅ $agent: Completed successfully" >> AGENT_COORDINATION_SUMMARY.md
            else
              echo "❌ $agent: Failed or skipped" >> AGENT_COORDINATION_SUMMARY.md
            fi
          done
          
          echo "" >> AGENT_COORDINATION_SUMMARY.md
          echo "## Key Findings" >> AGENT_COORDINATION_SUMMARY.md
          echo "" >> AGENT_COORDINATION_SUMMARY.md
          
          # Accessibility findings
          if [ -f "agent-reports/accessibility-report/accessibility-report.md" ]; then
            echo "### 🎯 Accessibility & UX Compliance" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Web interface validated for WCAG 2.1 AA compliance" >> AGENT_COORDINATION_SUMMARY.md
            echo "- CLI interface tested for screen reader compatibility" >> AGENT_COORDINATION_SUMMARY.md
            echo "" >> AGENT_COORDINATION_SUMMARY.md
          fi
          
          # Performance findings
          if [ -f "agent-reports/performance-security-report/performance-metrics.txt" ]; then
            echo "### 🚀 Performance & Security" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Bundle size: $(cat agent-reports/performance-security-report/performance-metrics.txt 2>/dev/null || echo 'Not measured')" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Security scans completed" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Load testing performed" >> AGENT_COORDINATION_SUMMARY.md
            echo "" >> AGENT_COORDINATION_SUMMARY.md
          fi
          
          # DevOps findings
          if [ -f "agent-reports/devops-infrastructure-report/resource-analysis.txt" ]; then
            echo "### ⚡ DevOps & Infrastructure" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Container security validated" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Kubernetes manifests checked" >> AGENT_COORDINATION_SUMMARY.md
            echo "- CI/CD pipeline analyzed" >> AGENT_COORDINATION_SUMMARY.md
            echo "" >> AGENT_COORDINATION_SUMMARY.md
          fi
          
          # Documentation findings
          if [ -f "agent-reports/documentation-community-report/docs-completeness.txt" ]; then
            echo "### 📚 Documentation & Community" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Documentation completeness verified" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Community health checked" >> AGENT_COORDINATION_SUMMARY.md
            echo "- Code examples validated" >> AGENT_COORDINATION_SUMMARY.md
            echo "" >> AGENT_COORDINATION_SUMMARY.md
          fi
          
          echo "## Next Steps" >> AGENT_COORDINATION_SUMMARY.md
          echo "" >> AGENT_COORDINATION_SUMMARY.md
          echo "1. Review individual agent reports for detailed findings" >> AGENT_COORDINATION_SUMMARY.md
          echo "2. Address any identified issues or warnings" >> AGENT_COORDINATION_SUMMARY.md
          echo "3. Update project based on agent recommendations" >> AGENT_COORDINATION_SUMMARY.md
          echo "4. Schedule next agent validation cycle" >> AGENT_COORDINATION_SUMMARY.md
      
      - name: Upload coordination summary
        uses: actions/upload-artifact@v4
        with:
          name: agent-coordination-summary
          path: AGENT_COORDINATION_SUMMARY.md
      
      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('AGENT_COORDINATION_SUMMARY.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Specialized Agents Validation Summary\n\n${summary}`
            });